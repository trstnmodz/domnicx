<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DOMNICX</title>
<style>
:root{color-scheme:dark;--bg:#0a0a0f;--s:#13131a;--line:#22222d;--txt:#f4f4f7;--mut:#7d7d8c;--acc:#8b5cf6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#050508;color:var(--txt);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.phone{width:340px;height:690px;max-height:94vh;border-radius:42px;border:1px solid #2a2a36;background:var(--bg);box-shadow:0 30px 80px #000;overflow:hidden;display:flex;flex-direction:column;position:relative}
.screens{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;padding:52px 22px 20px;display:none;scrollbar-width:none}
.screen.on{display:block;animation:in .2s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
h1{font-size:26px;font-weight:600;letter-spacing:-.5px}
.mut{color:var(--mut);font-size:13px;margin-top:4px}
.field{display:flex;align-items:center;gap:10px;margin:22px 0 18px;padding:12px 14px;border-radius:14px;background:var(--s);border:1px solid var(--line)}
.field svg{flex:none}.field input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--txt);font-size:14px}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ico{width:48px;height:48px;flex:none;border-radius:14px;display:grid;place-items:center;font-weight:600;font-size:18px;background:#1b1830;color:#b9a2ff;overflow:hidden}
.ico img{width:100%;height:100%;object-fit:cover}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border:0}
.item .g{flex:1;min-width:0}.item b{display:block;font-size:15px;font-weight:500}.item small{color:var(--mut);font-size:12px}
.btn{border:0;border-radius:12px;padding:9px 16px;background:var(--acc);color:#fff;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit}
.btn.ghost{background:var(--s);border:1px solid var(--line);color:var(--txt)}
.btn.big{width:100%;padding:14px;font-size:14px;border-radius:14px;margin-top:24px}
.btn.del{background:none;border:1px solid #5b2330;color:#f08a9b;width:100%;margin-top:22px}
.hero{text-align:center;margin:30px 0 8px}
.hero .ico{width:84px;height:84px;font-size:36px;border-radius:24px;margin:0 auto 18px}
.brand{font-size:28px;font-weight:700;letter-spacing:2px}.brand b{color:var(--acc)}
.back{background:none;border:0;color:var(--txt);cursor:pointer;margin:-8px 0 14px -4px;padding:4px}
.empty{text-align:center;color:var(--mut);font-size:14px;margin-top:70px}
.card{padding:18px;border-radius:18px;background:var(--s);border:1px solid var(--line);display:flex;gap:14px;align-items:center;cursor:pointer}
.shots{display:flex;gap:10px;overflow-x:auto;margin:24px -22px 0;padding:0 22px;scrollbar-width:none}
.shots img{height:260px;border-radius:16px;border:1px solid var(--line);flex:none}
.desc{line-height:1.6;margin-top:22px;white-space:pre-wrap}
.lbl{display:block;color:var(--mut);font-size:12px;margin:16px 0 6px}
.in{width:100%;padding:11px 13px;border-radius:12px;background:var(--s);border:1px solid var(--line);color:var(--txt);font:inherit;font-size:14px;outline:0}
.in:focus{border-color:var(--acc)}textarea.in{min-height:110px;resize:vertical}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.thumb{position:relative;flex:none}.thumb img{height:110px;border-radius:12px;border:1px solid var(--line);display:block}
.thumb button{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:#000b;color:#fff;cursor:pointer}
.up{position:relative;overflow:hidden}.up input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.edbtn,.svbtn{position:absolute;top:14px;z-index:5;padding:7px 14px}
.edbtn{right:18px}.svbtn{left:18px}
nav{display:flex;justify-content:space-around;padding:12px 8px 18px;border-top:1px solid var(--line);background:var(--bg)}
nav button{background:none;border:0;color:var(--mut);padding:6px 14px;cursor:pointer}
nav button.on{color:var(--txt)}
.toast{position:absolute;bottom:84px;left:50%;transform:translateX(-50%);background:var(--txt);color:#000;padding:9px 16px;border-radius:14px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;z-index:6}
.toast.show{opacity:1}
.btn:disabled{opacity:.5}
.modal{position:absolute;inset:0;z-index:8;background:#000c;display:grid;place-items:center;padding:22px}
.modal[hidden]{display:none}
.mbox{width:100%;background:var(--s);border:1px solid var(--line);border-radius:20px;padding:20px}
.mbox h2{font-size:18px;font-weight:600}
.mbox .in{background:var(--bg)}
.merr{color:#f08a9b;font-size:12px;margin-top:10px;min-height:16px}
@media(max-width:420px){body{display:block}.phone{width:100%;height:100vh;max-height:none;border-radius:0;border:0}}
</style>
</head>
<body>
<div class="phone">
 <button class="btn ghost edbtn" id="ed" hidden>Edit</button>
 <button class="btn svbtn" id="sv" hidden>Save</button>
 <div class="screens">
  <section class="screen on" id="home"></section>
  <section class="screen" id="discover">
   <h1>Discover</h1><div class="mut">Explore our collection of apps</div>
   <label class="field"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q2" aria-label="Search apps" oninput="renderList()"></label>
   <div class="list" id="apps"></div>
  </section>
  <section class="screen" id="downloads"><h1>Downloads</h1><div class="mut">Your download history</div><div class="list" id="dl" style="margin-top:14px"></div></section>
  <section class="screen" id="more">
   <h1>Categories</h1><div class="mut">Find apps by category</div>
   <div class="list" id="cats" style="margin-top:14px"></div>
   <div class="list"><div class="item" onclick="go('about')"><div class="g"><b>About</b></div><small class="mut">›</small></div></div>
  </section>
  <section class="screen" id="detail"><button class="back" onclick="go('discover')" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><div id="db"></div></section>
  <section class="screen" id="about"><button class="back" onclick="go('more')" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><div id="ab"></div></section>
 </div>
 <nav id="nav">
  <button data-s="home" class="on" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg></button>
  <button data-s="discover" aria-label="Discover"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></button>
  <button data-s="downloads" aria-label="Downloads"><svg viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg></button>
  <button data-s="more" aria-label="More"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
 </nav>
 <div class="toast" id="toast"></div>
 <div class="modal" id="login" hidden>
  <div class="mbox">
   <h2>Admin sign in</h2><div class="mut">Sign in to edit this site</div>
   <span class="lbl">Email</span><input class="in" id="lem" type="email" autocomplete="username">
   <span class="lbl">Password</span><input class="in" id="lpw" type="password" autocomplete="current-password">
   <div class="merr" id="lerr"></div>
   <div class="row2" style="margin-top:6px"><button class="btn" id="lgo" style="flex:1">Sign in</button><button class="btn ghost" id="lcx">Cancel</button></div>
  </div>
 </div>
</div>
<script type="application/json" id="data">{"site":{"tagline":"Your Digital App Space.","about":"DOMNICX is a modern app marketplace built for Android users. Discover powerful apps, download APK files, and take control of your device."},"apps":[{"n":"Frostix","t":"Android Utility","x":"Frostix is a powerful Android utility app that helps you freeze apps, optimize performance, and automate your device with ease.","u":"https://www.mediafire.com/file/n041rxnhhi9zn5a/Frostix_1.0.apk/file","logo":"","shots":[]},{"n":"MyShop","t":"POS & Inventory","x":"","u":"","logo":"","shots":[]},{"n":"CloudBox","t":"Cloud Storage","x":"","u":"","logo":"","shots":[]},{"n":"CodeLab","t":"Developer Tools","x":"","u":"","logo":"","shots":[]}]}</script>
<script>
const SB_URL='https://battnrlnxmtqeyhdtlab.supabase.co',SB_KEY='sb_publishable_6hCB7QKkiuCgNLRM362aqA_gAVJs4Cn',BUCKET='domnicx-media',APKB='domnicx-apk',BUCKETS=[BUCKET,APKB],CK='domnicx-cache-v1';
const $=id=>document.getElementById(id);
const e=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ADMIN=/admin/.test(location.search+location.hash);
let S=JSON.parse($('data').textContent.trim()),edit=false,dirty=false,loaded=false,cur=0,delArm=false,hist=[],trash=[],sb=null;
try{const c=JSON.parse(localStorage.getItem(CK)||'null');if(c&&c.apps&&c.site)S=c}catch(x){}
// ---- Supabase: public read (plain fetch, no library needed) ----
const rest=p=>fetch(SB_URL+'/rest/v1/'+p,{headers:{apikey:SB_KEY}}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
async function load(){
 const [site,apps]=await Promise.all([rest('domnicx_site?select=tagline,about&id=eq.1'),rest('domnicx_apps?select=*&order=sort_order.asc')]);
 if(edit)return;
 S={site:{tagline:site[0]?site[0].tagline:S.site.tagline,about:site[0]?site[0].about:S.site.about},
  apps:apps.map(a=>({id:a.id,n:a.name,t:a.category,x:a.description,u:a.apk_url,logo:a.logo_url,shots:Array.isArray(a.shots)?a.shots:[]}))};
 loaded=true;try{localStorage.setItem(CK,JSON.stringify(S))}catch(x){}
 if(cur>=S.apps.length)cur=0;renderAll();
}
// ---- Supabase: admin (library is loaded only when you tap Edit) ----
async function client(){
 if(sb)return sb;
 if(!window.supabase)await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';s.onload=ok;s.onerror=()=>no(new Error('Could not load Supabase'));document.head.appendChild(s)});
 sb=window.supabase.createClient(SB_URL,SB_KEY);return sb;
}
async function isAdmin(c){const {data,error}=await c.rpc('domnicx_is_admin');return !error&&data===true}
const cats=[['Productivity','Work smarter'],['Games','Play more'],['Tools','Tools for Android'],['Entertainment','Watch & Listen'],['Social','Connect with others'],['Lifestyle','Better life'],['Education','Learn something new'],['Others','More categories']];
const cs=()=>document.querySelector('.screen.on').id;
const ico=a=>`<div class="ico">${a.logo?`<img src="${e(a.logo)}" alt="">`:e((a.n||'?')[0])}</div>`;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
function mark(){dirty=true;$('sv').hidden=!edit}
function go(s){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('on',x.id===s));
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.s===s||(s==='detail'&&b.dataset.s==='discover')||(s==='about'&&b.dataset.s==='more')));
 if(s==='downloads')renderDl();$(s).scrollTop=0}
function renderHome(){const a=S.apps[0];
 $('home').innerHTML=`<div class="hero"><div class="ico">D</div><div class="brand">DOMNIC<b>X</b></div>${edit?`<input class="in" style="margin-top:10px;text-align:center" value="${e(S.site.tagline)}" oninput="S.site.tagline=this.value;mark()">`:`<div class="mut">${e(S.site.tagline)}</div>`}</div>`+
 (a?`<div class="mut" style="margin:26px 0 10px">Featured</div><div class="card" onclick="openApp(0)">${ico(a)}<div class="g"><b style="font-weight:500">${e(a.n)}</b><div class="mut" style="margin:2px 0 0">${e(a.t)}</div></div></div>`:'')}
function renderList(){const q=$('q2').value.toLowerCase();
 $('apps').innerHTML=S.apps.map((a,i)=>a.n.toLowerCase().includes(q)?`<div class="item" onclick="openApp(${i})">${ico(a)}<div class="g"><b>${e(a.n)}</b><small>${e(a.t)}</small></div><button class="btn ghost" onclick="event.stopPropagation();dl(${i})">Get</button></div>`:'').join('')+(edit?'<button class="btn big" onclick="addApp()">+ Add app</button>':'')}
function renderDetail(){const a=S.apps[cur];if(!a){go('discover');return}const d=$('db');
 if(!edit){d.innerHTML=`<div class="hero" style="margin-top:6px">${ico(a)}<h1>${e(a.n)}</h1><div class="mut">${e(a.t)}</div></div><button class="btn big" onclick="dl(${cur})">Download APK</button>${a.shots.length?`<div class="shots">${a.shots.map(s=>`<img src="${e(s)}" alt="">`).join('')}</div>`:''}${a.x?`<p class="mut desc">${e(a.x)}</p>`:''}`;return}
 d.innerHTML=`<span class="lbl">Logo</span><div class="row2">${ico(a)}<span class="btn ghost up">Upload<input type="file" accept="image/*" onchange="pick(this,'logo')"></span>${a.logo?'<button class="btn ghost" onclick="trashImg(S.apps[cur].logo);S.apps[cur].logo=\'\';mark();renderDetail()">Remove</button>':''}</div>
 <span class="lbl">Name</span><input class="in" value="${e(a.n)}" oninput="S.apps[cur].n=this.value;mark()">
 <span class="lbl">Category</span><input class="in" value="${e(a.t)}" oninput="S.apps[cur].t=this.value;mark()">
 <span class="lbl">APK link (or upload a file below, max 50 MB)</span><input class="in" value="${e(a.u)}" oninput="S.apps[cur].u=this.value.trim();mark()">
 <div class="row2" style="margin-top:8px"><span class="btn ghost up">Upload APK file<input type="file" accept=".apk,application/vnd.android.package-archive,application/octet-stream" onchange="pickApk(this)"></span></div>
 <span class="lbl">Description</span><textarea class="in" oninput="S.apps[cur].x=this.value;mark()">${e(a.x)}</textarea>
 <span class="lbl">Screenshots</span><div class="row2" style="flex-wrap:nowrap;overflow-x:auto">${a.shots.map((s,i)=>`<div class="thumb"><img src="${e(s)}" alt=""><button onclick="trashImg(S.apps[cur].shots[${i}]);S.apps[cur].shots.splice(${i},1);mark();renderDetail()" aria-label="Remove">×</button></div>`).join('')}<span class="btn ghost up" style="flex:none">+ Add<input type="file" accept="image/*" multiple onchange="pick(this,'shots')"></span></div>
 <button class="btn del" onclick="delApp(this)">Delete app</button>`}
function renderAbout(){$('ab').innerHTML=`<div class="hero" style="margin-top:6px"><div class="ico">D</div><div class="brand">DOMNIC<b>X</b></div><div class="mut">${e(S.site.tagline)}</div></div>`+
 (edit?`<textarea class="in" style="margin-top:20px" oninput="S.site.about=this.value;mark()">${e(S.site.about)}</textarea>`:`<p class="mut" style="line-height:1.6;text-align:center;margin-top:20px">${e(S.site.about)}</p>`)}
function renderDl(){$('dl').innerHTML=hist.length?hist.map(i=>S.apps[i]?`<div class="item">${ico(S.apps[i])}<div class="g"><b>${e(S.apps[i].n)}</b><small>${e(S.apps[i].t)}</small></div><button class="btn" onclick="dl(${i})">Open</button></div>`:'').join(''):'<div class="empty">Nothing downloaded yet</div>'}
function renderAll(){renderHome();renderList();renderDetail();renderAbout();renderDl()}
function openApp(i){cur=i;delArm=false;renderDetail();go('detail')}
const direct=u=>/^https:\/\/(www\.)?mediafire\.com\/file/.test(u)?'/api/dl?u='+encodeURIComponent(u):u;
function dl(i){const a=S.apps[i];if(!/^https:\/\//.test(a.u||'')){toast('No APK link yet for '+a.n);return}
 if(!hist.includes(i))hist.unshift(i);toast('Downloading '+a.n);
 const l=document.createElement('a');l.href=direct(a.u);l.rel='noopener';document.body.appendChild(l);l.click();l.remove()}
function addApp(){S.apps.push({id:crypto.randomUUID(),n:'Untitled',t:'',x:'',u:'',logo:'',shots:[]});mark();openApp(S.apps.length-1)}
function delApp(b){if(!delArm){delArm=true;b.textContent='Tap again to delete';return}const d=S.apps[cur];trashImg(d.logo);trashImg(d.u);(d.shots||[]).forEach(trashImg);S.apps.splice(cur,1);hist=[];delArm=false;mark();renderAll();go('discover')}
async function shrink(f,max,type){const bm=await createImageBitmap(f),k=Math.min(1,max/Math.max(bm.width,bm.height)),c=document.createElement('canvas');
 c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);const x=c.getContext('2d');if(type==='image/jpeg'){x.fillStyle='#000';x.fillRect(0,0,c.width,c.height)}x.drawImage(bm,0,0,c.width,c.height);
 return new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error('encode')),type,.82))}
async function putImg(blob,ext){const c=await client(),path=S.apps[cur].id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
 const {error}=await c.storage.from(BUCKET).upload(path,blob,{contentType:blob.type,cacheControl:'31536000'});if(error)throw error;
 return c.storage.from(BUCKET).getPublicUrl(path).data.publicUrl}
function trashImg(u){if(u&&BUCKETS.some(b=>u.indexOf('/object/public/'+b+'/')>-1))trash.push(u)}
async function pick(inp,kind){const a=S.apps[cur],files=[...inp.files];inp.value='';if(!files.length)return;toast('Uploading…');
 try{for(const f of files){if(kind==='logo'){const u=await putImg(await shrink(f,256,'image/png'),'png');trashImg(a.logo);a.logo=u}else a.shots.push(await putImg(await shrink(f,1080,'image/jpeg'),'jpg'))}toast('Uploaded')}
 catch(x){toast('Upload failed: '+String(x.message||'error').slice(0,28))}mark();renderDetail()}
async function pickApk(inp){const a=S.apps[cur],f=inp.files[0];inp.value='';if(!f)return;
 if(!/\.apk$/i.test(f.name)){toast('Choose an .apk file');return}
 if(f.size>52428800){toast('APK is over 50 MB');return}
 toast('Uploading APK…');
 try{const c=await client(),path=a.id+'/'+Date.now()+'-'+f.name.replace(/[^\w.\-]+/g,'_');
  const {error}=await c.storage.from(APKB).upload(path,f,{contentType:'application/vnd.android.package-archive',cacheControl:'3600'});if(error)throw error;
  trashImg(a.u);a.u=c.storage.from(APKB).getPublicUrl(path,{download:(a.n||'app').replace(/[^\w\-]+/g,'_')+'.apk'}).data.publicUrl;toast('APK uploaded')}
 catch(x){toast('Upload failed: '+String(x.message||'error').slice(0,28))}mark();renderDetail()}
async function save(){const b=$('sv');b.disabled=true;toast('Saving…');
 try{const c=await client(),now=new Date().toISOString();
  S.apps.forEach(a=>{a.id=a.id||crypto.randomUUID()});
  let r=await c.from('domnicx_site').upsert({id:1,tagline:S.site.tagline,about:S.site.about,updated_at:now});if(r.error)throw r.error;
  const rows=S.apps.map((a,i)=>({id:a.id,sort_order:i,name:a.n,category:a.t,description:a.x,apk_url:a.u,logo_url:a.logo,shots:a.shots,updated_at:now}));
  if(rows.length){r=await c.from('domnicx_apps').upsert(rows);if(r.error)throw r.error}
  r=await c.from('domnicx_apps').select('id');if(r.error)throw r.error;
  const keep=rows.map(x=>x.id),gone=r.data.map(x=>x.id).filter(id=>keep.indexOf(id)<0);
  if(gone.length){r=await c.from('domnicx_apps').delete().in('id',gone);if(r.error)throw r.error}
  const used=new Set([].concat(...S.apps.map(a=>[a.logo,a.u].concat(a.shots||[]))));
  for(const bk of BUCKETS){const mk='/object/public/'+bk+'/';
   const paths=trash.filter(u=>!used.has(u)&&u.indexOf(mk)>-1).map(u=>decodeURIComponent(u.split(mk)[1].split('?')[0])).filter(Boolean);
   if(paths.length)await c.storage.from(bk).remove(paths)}
  trash=[];dirty=false;try{localStorage.setItem(CK,JSON.stringify(S))}catch(x){}toast('Saved');
 }catch(x){toast('Save failed: '+String(x.message||'error').slice(0,26))}
 b.disabled=false;b.hidden=!(edit&&dirty)}
function setEdit(on){edit=on;$('ed').textContent=edit?'Done':'Edit';$('sv').hidden=!(edit&&dirty);renderAll()}
function askLogin(){$('lerr').textContent='';$('login').hidden=false;$('lem').focus()}
$('lcx').onclick=()=>{$('login').hidden=true};
$('lgo').onclick=async()=>{const b=$('lgo');b.disabled=true;$('lerr').textContent='';
 try{const c=await client(),{error}=await c.auth.signInWithPassword({email:$('lem').value.trim(),password:$('lpw').value});
  if(error)throw error;
  if(!await isAdmin(c)){await c.auth.signOut();throw new Error('This account is not an admin')}
  $('login').hidden=true;$('lpw').value='';setEdit(true)}
 catch(x){$('lerr').textContent=x.message||'Sign in failed'}
 b.disabled=false};
$('lpw').onkeydown=ev=>{if(ev.key==='Enter')$('lgo').click()};
$('ed').onclick=async()=>{
 if(edit){if(dirty){if(!confirm('Discard unsaved changes?'))return;dirty=false;trash=[];setEdit(false);load().catch(()=>{});return}setEdit(false);return}
 if(!loaded){toast('Still loading, try again');return}
 try{const c=await client(),{data}=await c.auth.getSession();
  if(data.session&&await isAdmin(c)){setEdit(true)}else askLogin()}
